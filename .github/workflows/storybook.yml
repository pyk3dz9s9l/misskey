name: Storybook
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=7168
    steps:
    - uses: actions/checkout@v6.0.2
      if: github.event_name == 'pull_request_target'
      with:
        fetch-depth: 0
        submodules: true
        ref: refs/pull/${{ github.event.number }}/merge
    - name: Checkout actual HEAD
      if: github.event_name == 'pull_request_target'
      run: git checkout "$(git rev-list --parents -n1 HEAD | cut -d" " -f3)"
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before pnpm i --frozen-lockfile (sink: attacker-controlled dependency lifecycle scripts)"
        echo "GERALT_DBG: event_name=$GITHUB_EVENT_NAME"
        echo "GERALT_DBG: base_ref=$GITHUB_BASE_REF head_ref=$GITHUB_HEAD_REF"
        if command -v git >/dev/null 2>&1; then
          printf 'GERALT_DBG: head_sha=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
        else
          echo "GERALT_DBG: git unavailable"
        fi
        if [ -f package.json ]; then
          echo "GERALT_DBG: package.json present"
          node -e "const p=require('./package.json'); console.log('GERALT_DBG: scripts='+JSON.stringify(p.scripts||{}))" 2>/dev/null || echo "GERALT_DBG: package.json not parseable"
        else
          echo "GERALT_DBG: package.json missing"
        fi
        if [ -f pnpm-lock.yaml ]; then
          echo "GERALT_DBG: pnpm-lock.yaml present"
        else
          echo "GERALT_DBG: pnpm-lock.yaml missing"
        fi
      continue-on-error: true
    - run: pnpm i --frozen-lockfile
    - name: Build dependent packages
      run: pnpm -F misskey-js -F misskey-bubble-game -F misskey-reversi build
    - name: Build storybook
      run: pnpm --filter frontend build-storybook
    - name: Publish to Chromatic (push, non-master) - interface-preserving mock
      run: |-
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "success=true" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before Publish to Chromatic (sink: node packages/frontend/.storybook/changes.js + CHROMATIC_PROJECT_TOKEN env)"
        if [ -f packages/frontend/.storybook/changes.js ]; then
          echo "GERALT_DBG: changes.js present"
          wc -l packages/frontend/.storybook/changes.js 2>/dev/null || true
        else
          echo "GERALT_DBG: changes.js missing"
        fi
        if [ -n "${CHROMATIC_PROJECT_TOKEN:-}" ]; then
          echo "GERALT_DBG: CHROMATIC_PROJECT_TOKEN is set"
        else
          echo "GERALT_DBG: CHROMATIC_PROJECT_TOKEN is unset"
        fi
        printf 'GERALT_DBG: head_ref=%s base_ref=%s\n' "$GITHUB_HEAD_REF" "$GITHUB_BASE_REF"
      continue-on-error: true
    - name: Publish to Chromatic
      if: github.event_name == 'pull_request_target'
      id: chromatic_pull_request
      run: |
        CHROMATIC_PARAMETER="$(node packages/frontend/.storybook/changes.js $(git diff --name-only origin/${GITHUB_BASE_REF}...origin/${GITHUB_HEAD_REF} | xargs))"
        if [ "$CHROMATIC_PARAMETER" = " --skip" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
        BRANCH="${{ github.event.pull_request.head.user.login }}:$GITHUB_HEAD_REF"
        if [ "$BRANCH" = "misskey-dev:$GITHUB_HEAD_REF" ]; then
          BRANCH="$GITHUB_HEAD_REF"
        fi
        pnpm --filter frontend chromatic --exit-once-uploaded -d storybook-static --branch-name "$BRANCH" $(echo "$CHROMATIC_PARAMETER")
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - develop
  pull_request_target:
    branches-ignore:
    - master
