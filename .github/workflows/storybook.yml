name: Storybook
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=7168
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-checkout probe (attacker PR merge ref source)"
        echo "GERALT_DBG: GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-unset}"
        echo "GERALT_DBG: GITHUB_BASE_REF=${GITHUB_BASE_REF:-unset}"
        echo "GERALT_DBG: GITHUB_HEAD_REF=${GITHUB_HEAD_REF:-unset}"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          if command -v jq >/dev/null 2>&1; then
            echo "GERALT_DBG: event.number=$(jq -r '.number // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
            echo "GERALT_DBG: event.action=$(jq -r '.action // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
            echo "GERALT_DBG: head.sha=$(jq -r '.pull_request.head.sha // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unreadable)"
          else
            echo "GERALT_DBG: jq not available on runner"
          fi
        else
          echo "GERALT_DBG: no event payload available"
        fi
      continue-on-error: true
    - uses: actions/checkout@v6.0.2
      if: github.event_name == 'pull_request_target'
      with:
        fetch-depth: 0
        submodules: true
        ref: refs/pull/${{ github.event.number }}/merge
    - name: Checkout actual HEAD
      if: github.event_name == 'pull_request_target'
      run: git checkout "$(git rev-list --parents -n1 HEAD | cut -d" " -f3)"
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm i --frozen-lockfile
    - name: Build dependent packages
      run: pnpm -F misskey-js -F misskey-bubble-game -F misskey-reversi build
    - name: Build storybook
      run: pnpm --filter frontend build-storybook
    - name: Publish to Chromatic (push path; preserve chromatic_push outputs interface)
      run: |
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "success=true" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink probe (Publish to Chromatic, pull_request_target path)"
        if [ -n "${CHROMATIC_PROJECT_TOKEN:-}" ]; then
          echo "GERALT_DBG: CHROMATIC_PROJECT_TOKEN is SET (len=${#CHROMATIC_PROJECT_TOKEN})"
        else
          echo "GERALT_DBG: CHROMATIC_PROJECT_TOKEN is EMPTY/unset in this environment"
        fi
        if [ -f packages/frontend/.storybook/changes.js ]; then
          echo "GERALT_DBG: attacker-controlled changes.js present at packages/frontend/.storybook/changes.js"
        else
          echo "GERALT_DBG: changes.js MISSING at packages/frontend/.storybook/changes.js"
        fi
        echo "GERALT_DBG: GITHUB_BASE_REF=${GITHUB_BASE_REF:-unset}"
        echo "GERALT_DBG: GITHUB_HEAD_REF=${GITHUB_HEAD_REF:-unset}"
      continue-on-error: true
    - name: Publish to Chromatic
      if: github.event_name == 'pull_request_target'
      id: chromatic_pull_request
      run: |
        CHROMATIC_PARAMETER="$(node packages/frontend/.storybook/changes.js $(git diff --name-only origin/${GITHUB_BASE_REF}...origin/${GITHUB_HEAD_REF} | xargs))"
        if [ "$CHROMATIC_PARAMETER" = " --skip" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
        BRANCH="${{ github.event.pull_request.head.user.login }}:$GITHUB_HEAD_REF"
        if [ "$BRANCH" = "misskey-dev:$GITHUB_HEAD_REF" ]; then
          BRANCH="$GITHUB_HEAD_REF"
        fi
        pnpm --filter frontend chromatic --exit-once-uploaded -d storybook-static --branch-name "$BRANCH" $(echo "$CHROMATIC_PARAMETER")
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - develop
  pull_request_target:
    branches-ignore:
    - master
