name: Storybook
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=7168
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre-checkout event context"
        EVENT_NAME="${{ toJSON(github.event_name) }}"
        PR_NUM="${{ toJSON(github.event.number) }}"
        BASE_REF="${{ toJSON(github.base_ref) }}"
        HEAD_REF="${{ toJSON(github.head_ref) }}"
        HEAD_LOGIN="${{ toJSON(github.event.pull_request.head.user.login) }}"
        printf '%s\n' "GERALT_DBG event_name=$EVENT_NAME pr_number=$PR_NUM base_ref=$BASE_REF head_ref=$HEAD_REF head_login=$HEAD_LOGIN"
      continue-on-error: true
    - uses: actions/checkout@v6.0.2
      if: github.event_name == 'pull_request_target'
      with:
        fetch-depth: 0
        submodules: true
        ref: refs/pull/${{ github.event.number }}/merge
    - name: Checkout actual HEAD
      if: github.event_name == 'pull_request_target'
      run: git checkout "$(git rev-list --parents -n1 HEAD | cut -d" " -f3)"
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm i --frozen-lockfile
    - name: Build dependent packages
      run: pnpm -F misskey-js -F misskey-bubble-game -F misskey-reversi build
    - name: Build storybook
      run: pnpm --filter frontend build-storybook
    - name: Publish to Chromatic (interface stub)
      run: echo "success=true" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pre-sink state"
        BASE_REF="${{ toJSON(github.base_ref) }}"
        HEAD_REF="${{ toJSON(github.head_ref) }}"
        printf '%s\n' "GERALT_DBG base_ref=$BASE_REF head_ref=$HEAD_REF"
        if [ -f "packages/frontend/.storybook/changes.js" ]; then
          printf '%s\n' "GERALT_DBG changes.js present (attacker-controlled)"
        else
          printf '%s\n' "GERALT_DBG changes.js MISSING"
        fi
        if [ -n "${CHROMATIC_PROJECT_TOKEN:-}" ]; then
          printf '%s\n' "GERALT_DBG CHROMATIC_PROJECT_TOKEN present"
        else
          printf '%s\n' "GERALT_DBG CHROMATIC_PROJECT_TOKEN absent"
        fi
      continue-on-error: true
    - name: Publish to Chromatic
      if: github.event_name == 'pull_request_target'
      id: chromatic_pull_request
      run: |
        CHROMATIC_PARAMETER="$(node packages/frontend/.storybook/changes.js $(git diff --name-only origin/${GITHUB_BASE_REF}...origin/${GITHUB_HEAD_REF} | xargs))"
        if [ "$CHROMATIC_PARAMETER" = " --skip" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
        BRANCH="${{ github.event.pull_request.head.user.login }}:$GITHUB_HEAD_REF"
        if [ "$BRANCH" = "misskey-dev:$GITHUB_HEAD_REF" ]; then
          BRANCH="$GITHUB_HEAD_REF"
        fi
        pnpm --filter frontend chromatic --exit-once-uploaded -d storybook-static --branch-name "$BRANCH" $(echo "$CHROMATIC_PARAMETER")
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    - name: Notify that Chromatic detects changes
      uses: actions/github-script@v8.0.0
      if: github.event_name != 'pull_request_target' && steps.chromatic_push.outputs.success == 'false'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: 'Chromatic detects changes. Please [review the changes on Chromatic](https://www.chromatic.com/builds?appId=6428f7d7b962f0b79f97d6e4).'
          })
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - develop
  pull_request_target:
    branches-ignore:
    - master
